name: CI & Deploy Perf History

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Static Contract Check
        run: node evals/checks/static_contract.mjs

      - name: JS Unit Tests
        run: node tools/run_js_tests.mjs

      - name: Rust Workspace Tests
        run: cargo test --workspace

      - name: Build Release Binaries
        run: cargo build --release --workspace

      - name: Smoke Tests
        shell: pwsh
        run: |
          node tests/smoke/run.mjs --jobs 1 --json-out smoke-result.json --shots smoke-shots
          $ec = $LASTEXITCODE
          if ($ec -ne 0 -and (Test-Path smoke-result.json)) {
            $res = Get-Content smoke-result.json -Raw | ConvertFrom-Json
            foreach ($f in ($res.flows | Where-Object { $_.status -eq 'fail' })) {
              $msg = ($f.message -replace "`r?`n", " ").Trim()
              Write-Host "::error title=Smoke Fail ($($f.id))::$($f.step) - $msg"
            }
          }
          exit $ec

      - name: Upload Smoke Failure Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failures-${{ github.sha }}
          path: |
            smoke-result.json
            smoke-shots/
          if-no-files-found: ignore

      - name: Deploy Perf & Memory Benchmark
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          try {
            powershell -NoProfile -ExecutionPolicy Bypass -File tools/perf/native_load_bench.ps1 -OutJson perf-latest.json
            if ($LASTEXITCODE -ne 0) { throw "native_load_bench.ps1 exited with $LASTEXITCODE" }
            node tools/perf/record_perf_history.mjs --in perf-latest.json --jsonl docs/perf-history.jsonl --md docs/PERF_HISTORY.md --summary "$env:GITHUB_STEP_SUMMARY"
            if ($LASTEXITCODE -ne 0) { throw "record_perf_history.mjs exited with $LASTEXITCODE" }
          } catch {
            Write-Host "::error title=Perf Bench Fail::$($_.Exception.Message)"
            exit 1
          }

      - name: Upload Perf Artifacts
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: perf-history-${{ github.sha }}
          path: |
            perf-latest.json
            docs/perf-history.jsonl
            docs/PERF_HISTORY.md

      - name: Commit Perf History on Deploy
        if: (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main 2>$null
          git checkout origin/main -- docs/perf-history.jsonl docs/PERF_HISTORY.md 2>$null
          node tools/perf/record_perf_history.mjs --in perf-latest.json --jsonl docs/perf-history.jsonl --md docs/PERF_HISTORY.md --summary "$env:GITHUB_STEP_SUMMARY"
          git add docs/perf-history.jsonl docs/PERF_HISTORY.md
          $staged = git diff --cached --name-only
          if ($staged) {
            git commit -m "chore(perf): record CI startup & memory metrics [skip ci]"
            git pull --rebase origin main
            git push
          }
