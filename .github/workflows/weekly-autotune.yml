name: Weekly Zero-Token Perf Autotune

on:
  schedule:
    # Every Sunday 03:00 JST (Saturday 18:00 UTC)
    - cron: "0 18 * * 6"
  workflow_dispatch:
    inputs:
      rounds:
        description: "Max autotune rounds (1-5)"
        required: false
        default: "5"
      iterations:
        description: "Max iterations per round (1-50)"
        required: false
        default: "50"

permissions:
  contents: write

concurrency:
  group: weekly-autotune
  cancel-in-progress: false

jobs:
  autotune:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Release Binaries
        run: cargo build --release --bins

      - name: Run Zero-Token Autotune Loop
        shell: pwsh
        run: |
          $rounds = "${{ github.event.inputs.rounds }}"
          if (-not $rounds) { $rounds = "5" }
          $iters = "${{ github.event.inputs.iterations }}"
          if (-not $iters) { $iters = "50" }
          node tools/perf/autotune_loop.mjs --rounds $rounds --iterations $iters --patience 8 --min-improve 0.01 --fast-gate --history docs/tuning-history-v2.jsonl | Tee-Object -FilePath autotune-summary.json

      - name: Check If Params Improved
        id: check
        shell: pwsh
        run: |
          $changed = git diff --name-only config/perf_params.json
          if ($changed) {
            "improved=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "improved=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Full UX Regression Gate (when improved)
        if: steps.check.outputs.improved == 'true'
        shell: pwsh
        run: |
          node evals/checks/static_contract.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/run_js_tests.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/smoke/run.mjs --jobs 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit & Push Adopted Params
        if: steps.check.outputs.improved == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/perf_params.json docs/tuning-history-v2.jsonl
          git commit -m "perf(autotune): weekly zero-token parameter optimization"
          git pull --rebase origin main
          git push

      - name: Upload Autotune Summary Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-autotune-${{ github.run_id }}
          path: |
            autotune-summary.json
            docs/tuning-history-v2.jsonl
          if-no-files-found: ignore
