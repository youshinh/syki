[workspace]
resolver = "2"
members = [
    "crates/syki-core",
    "crates/syki-win",
    "crates/syki-gui",
    "crates/syki-cli",
]

[workspace.package]
version = "0.0.6"
edition = "2021"
license = "MIT"

[workspace.dependencies]
syki-core = { path = "crates/syki-core" }
syki-win = { path = "crates/syki-win" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
encoding_rs = "0.8"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.22"
flate2 = "1"
memmap2 = "0.9"
png = "0.17"
notify = "8"
tempfile = "3"
ureq = "2"
webview2-com = "0.39.1"
windows = "0.62"
windows-core = "0.62"
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = "s"
panic = "abort"
